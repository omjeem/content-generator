version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# LinkedIn AI Content Generator — Docker Compose
#
# Usage (local build):
#   1. Copy .env.docker.example → .env
#   2. Fill in MONGODB_URI, JWT_SECRET, GOOGLE_GENERATIVE_AI_API_KEY
#   3. docker compose up --build
#
# Usage (pull from Docker Hub — no build needed):
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API — Express + TypeScript ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: content-generator-api
    container_name: content-generator-api
    ports:
      - "5006:5006"
    environment:
      - NODE_ENV=production
      - PORT=5006
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5006/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks:
      - app-network

  # ── Web — Next.js 14 ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # IMPORTANT: This must be the URL your BROWSER will use to reach the API.
        # On the same server: use the server's IP or domain, e.g.:
        #   http://YOUR_SERVER_IP:5006
        #   https://api.yourdomain.com
        # This value is baked into the Next.js bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5006}
    image: content-generator-web
    container_name: content-generator-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
