name: Build & Push Docker Images

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   - Every push to 'main' branch
#   - Manual trigger via GitHub Actions UI (workflow_dispatch)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom image tag (defaults to "latest")'
        required: false
        default: 'latest'

# Cancel in-progress runs of the same workflow when a new push arrives
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Change these to your Docker Hub username and desired image names
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  API_IMAGE_NAME: content-generator-api
  WEB_IMAGE_NAME: content-generator-web

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Build & Push API image
  # ───────────────────────────────────────────────────────────────────────────
  build-api:
    name: Build & Push API (Express)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for multi-platform builds (linux/amd64 + linux/arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for advanced build features (cache, multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate image tags and labels automatically
      # Tags produced:
      #   - latest (on main branch)
      #   - sha-<short-git-sha> (always — for rollbacks)
      #   - YYYY.MM.DD (calendar versioning)
      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=schedule,pattern={{date 'YYYY.MM.DD'}}
          labels: |
            org.opencontainers.image.title=Content Generator API
            org.opencontainers.image.description=Express + TypeScript API for LinkedIn AI Content Generator
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # Build and push the API Docker image
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # GitHub Actions cache — speeds up subsequent builds significantly
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Build & Push Web image
  # ───────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build & Push Web (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=schedule,pattern={{date 'YYYY.MM.DD'}}
          labels: |
            org.opencontainers.image.title=Content Generator Web
            org.opencontainers.image.description=Next.js 14 frontend for LinkedIn AI Content Generator
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # Build and push the Web Docker image
      # NOTE: NEXT_PUBLIC_API_URL is baked into the bundle at build time.
      # Set the NEXT_PUBLIC_API_URL secret in your GitHub repository to your
      # production API URL (e.g. http://your-server-ip:3001)
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Summary — runs after both builds succeed
  # ───────────────────────────────────────────────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## 🚀 Docker Build & Push Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:latest\` | ${{ needs.build-api.result == 'success' && '✅ Pushed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE_NAME }}:latest\` | ${{ needs.build-web.result == 'success' && '✅ Pushed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Git SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy to your server:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker compose -f docker-compose.yml -f docker-compose.prod.yml pull" >> $GITHUB_STEP_SUMMARY
          echo "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
